name: Weekly News Scraper

# v2 (06-10-2026): weekly/nieuws.py (gemeten feeds + Google News, per bron begrensd, drie uitkomsten per bron)
# en weekly/cbs_regio.py (CBS-vacatures per provincie en sector). De oude scraper.js draait niet meer.
on:
  # Elke maandag om 05:00 UTC (07:00 NL zomertijd), vóór Wouters /week
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (alleen tonen, niets opslaan)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zelftests
        run: |
          python3 weekly/nieuws.py --zelftest
          python3 weekly/cbs_regio.py --zelftest

      - name: Nieuws ophalen
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            python3 weekly/nieuws.py --droog
          else
            python3 weekly/nieuws.py
          fi

      - name: CBS-regiocijfers ophalen
        if: github.event.inputs.dry_run != 'true'
        # CBS onbereikbaar mag de nieuwsrun niet blokkeren: de vorige cijfers blijven dan staan
        continue-on-error: true
        run: python3 weekly/cbs_regio.py

      - name: Commit en push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add digest/ arbeidsmarkt/ news-data.js regio-data.js
          if git diff --cached --quiet; then
            echo "Niets nieuws deze week"; exit 0
          fi
          git commit -m "Weekly news $(date -u +%G-W%V): digest + regiocijfers"
          git push

      - name: Samenvatting
        if: always()
        run: |
          echo "## Weekly news" >> $GITHUB_STEP_SUMMARY
          if [ -f digest/latest.md ]; then sed -n '1,200p' digest/latest.md >> $GITHUB_STEP_SUMMARY; fi
